name: CI/CD Pipeline - Backend API

on:
  push:
    branches:
      - main
      - develop
      - convert/nestjs
    paths:
      - 'Be-calander/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'Be-calander/**'

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/calendar-api

jobs:
  # ========================================
  # Stage 1: Code Quality & Testing
  # ========================================
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    working-directory: ./Be-calander
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'Be-calander/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: ./Be-calander

      - name: Run linter
        run: npm run lint
        continue-on-error: true
        working-directory: ./Be-calander

      - name: Type checking
        run: npx tsc --noEmit
        working-directory: ./Be-calander

      - name: Run tests
        run: npm run test
        continue-on-error: true
        working-directory: ./Be-calander

  # ========================================
  # Stage 2: Build & Push Docker Image
  # ========================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./Be-calander
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========================================
  # Stage 3: Deploy (Optional - uncomment when ready)
  # ========================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          script: |
            cd /app/JobManager
            
            # Update environment variables
            cat > Be-calander/.env.production << EOF
            NODE_ENV=production
            DB_HOST=${{ secrets.DB_HOST }}
            DB_PORT=${{ secrets.DB_PORT }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_DIALECT=${{ secrets.DB_DIALECT }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            EOF
            
            # Pull latest image and restart
            cd Be-calander
            docker-compose pull
            docker-compose up -d
            
            # Show logs
            docker-compose logs --tail=50 backend

      - name: Slack Notification
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Calendar API Deployment ${{ job.status }}'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
          fields: repo,message,commit,author
        continue-on-error: true
