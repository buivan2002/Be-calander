version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: calendar_mysql
    environment:
      MYSQL_ROOT_PASSWORD: Levcloud2025@@
      MYSQL_DATABASE: Lev_test_db
      MYSQL_USER: levtest
      MYSQL_PASSWORD: Levcloud2025@@
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - calendar_network

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: calendar_backend
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: levtest
      DB_PASSWORD: Levcloud2025@@
      DB_NAME: Lev_test_db
      DB_DIALECT: mysql
      JWT_SECRET: calendar_secret_key
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - calendar_network
    command: npm start

volumes:
  mysql_data:
    driver: local

networks:
  calendar_network:
    driver: bridge
